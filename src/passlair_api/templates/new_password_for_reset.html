{% extends "base.html" %}

{% block title %}Set new password · passLair{% endblock %}

{% block content %}
    <a class="back-link" href="{{ url_for('auth.reset_password') }}">&larr; Start over</a>
    <h1 class="page-title">Set a new password</h1>
    <p class="page-description">Your backup phrase checked out. Choose a new password below.</p>

    <div class="card">
        <form method="post" action="">
            <label>
                New password
                <input type="password" name="password" autocomplete="new-password" required>
            </label>
            <label>
                Confirm new password
                <input type="password" name="password_confirm" autocomplete="new-password" required>
            </label>
            <div class="actions-row">
                <button type="submit" class="btn-primary">Set new password</button>
            </div>
        </form>
    </div>
{% endblock %}
