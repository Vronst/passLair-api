<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}passLair{% endblock %}</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='lock.svg') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('auth.landing') }}">
        <img src="{{ url_for('static', filename='lock.svg') }}" alt="" />
        passLair
      </a>
      <nav class="site-nav">
        <a
          href="{{ url_for('auth.landing') }}"
          class="{{ 'active' if request.endpoint in ('auth.landing', 'auth.user') }}"
          >Account</a
        >
        <a
          href="{{ url_for('password_manager.landing') }}"
          class="{{ 'active' if request.blueprint == 'password_manager' }}"
          >Passwords</a
        >
        <a
          href="{{ url_for('data.landing') }}"
          class="{{ 'active' if request.blueprint == 'data' }}"
          >Data</a
        >
        {% if logged_in %}
        <a
          href="{{ url_for('auth.logout') }}"
          class="{{ 'active' if request.endpoint == 'auth.logout' }}"
          >Log out</a
        >
        {% else %}
        <a
          href="{{ url_for('auth.login') }}"
          class="{{ 'active' if request.endpoint == 'auth.login' }}"
          >Log in</a
        >
        <a
          href="{{ url_for('auth.register') }}"
          class="{{ 'active' if request.endpoint == 'auth.register' }}"
          >Register</a
        >
        {% endif %}
      </nav>
    </header>

    <main>{% block content %}{% endblock %}</main>

    <footer class="site-footer">passLair — your passwords, guarded.</footer>

    {% include "_backup_phrase_dialog.html" %}
  </body>
</html>
