<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}passLair{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='lock.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('auth.landing') }}">
            <img src="{{ url_for('static', filename='lock.svg') }}" alt="">
            passLair
        </a>
        <nav class="site-nav">
            <a href="{{ url_for('auth.landing') }}"{% if request.blueprint == 'auth' and request.endpoint not in ('auth.register', 'auth.logout') %} class="active"{% endif %}>Account</a>
            <a href="{{ url_for('password_manager.landing') }}"{% if request.blueprint == 'password_manager' %} class="active"{% endif %}>Passwords</a>
            <a href="{{ url_for('data.landing') }}"{% if request.blueprint == 'data' %} class="active"{% endif %}>Data</a>
            {% if logged_in %}
            <a href="{{ url_for('auth.logout') }}"{% if request.endpoint == 'auth.logout' %} class="active"{% endif %}>Log out</a>
            {% else %}
            <a href="{{ url_for('auth.register') }}"{% if request.endpoint == 'auth.register' %} class="active"{% endif %}>Register</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        passLair — your passwords, guarded.
    </footer>

    {% include "_backup_phrase_dialog.html" %}
</body>
</html>
