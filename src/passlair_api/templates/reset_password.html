{% extends "base.html" %}

{% block title %}Reset password · passLair{% endblock %}

{% block content %}
    <a class="back-link" href="{{ url_for('auth.login') }}">&larr; Log in</a>
    <h1 class="page-title">Reset your password</h1>
    <p class="page-description">Enter your backup phrase to verify it's you.</p>

    <div class="card">
        <form method="post" action="{{ url_for('auth.new_password') }}">
            <label>
                Backup phrase
                <textarea name="backup_phrase" placeholder="Enter your backup phrase, words separated by spaces" required></textarea>
                <span class="field-hint">This is the phrase you saved when you set up your account.</span>
            </label>
            <div class="actions-row">
                <button type="submit" class="btn-primary">Continue</button>
            </div>
        </form>
    </div>
{% endblock %}
