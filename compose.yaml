services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

  memcached:
    image: memcached
    command:
      - --conn-limit=1024
      - --memory-limit=64
      - --threads=4
      - -U
      - "0"

  # passlair-api-app-1
  app:
    build:
      context: .
    environment:
      - REDIS_HOST=redis
      - MEMCACHED_HOST=memcached
      - DATABASE=sqlite
      - DEK_FILE_PATH=/run/secrets/app_dek
      - SECRET_KEY=YouToughtIWouldPushItXD?
      - SQLITE_PATH=/app/passlair.db
    ports:
      - "8888:8888"
    volumes:
      - app-data:/app/passlair_api:z
      - ./secrets/dek.key:/run/secrets/app_dek:ro,z

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/:/etc/nginx/:ro,z
    depends_on:
      - app
    ports:
      - "9000:20434"

volumes:
  redis-data:
    driver: local
  app-data:
    driver: local
