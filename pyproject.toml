[project]
name = "passlair-api"
version = "0.1.0"
description = "Flask app - password manager"
readme = "README.md"
authors = [
    { name = "Adam Sarga", email = "vronst@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-session[redis]>=0.8.0",
    "flask-talisman>=1.1.0",
    "jinja2>=3.1.6",
    "passlair",
    "redis[hiredis]>=8.1.0",
]

[project.scripts]
passlair-api = "passlair_api:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
passlair = { git = "https://github.com/Vronst/passLair-core" }
